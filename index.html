<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f4d3a">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mvama Learner Entry</title>
<style>
:root{--bg:#f3efe9;--card:#fff;--tx:#14231d;--mut:#74807a;--bd:#e7e3dc;--pr:#0f4d3a;--ac:#1f9d6a;--gold:#d9a520;--er:#c93a3a;--ok:#1f9d6a;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:1.15rem;margin:0;font-weight:700}.sub{color:var(--mut);font-size:.8rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input,button{font:inherit;padding:13px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:var(--bd);color:var(--tx)}button.dk{background:var(--pr)}button.wh{background:#fff;color:var(--tx)}button:disabled{opacity:.6}
label{display:block;font-size:.72rem;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.av{width:40px;height:40px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700}
.pill{background:var(--gold);color:#2b2200;border-radius:10px;padding:2px 9px;font-size:.7rem;font-weight:700;display:inline-block;vertical-align:middle}
.hero{background:linear-gradient(160deg,#145a45,#0a3a2c);color:#fff;border-radius:22px;padding:18px}
.hero small{opacity:.7;font-size:.72rem}.big{font-size:2.4rem;font-weight:700;line-height:1.1;margin:2px 0 8px}
.mini{display:flex;gap:8px;margin-top:14px}.mini div{flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:10px}.mini b{display:block;font-size:1.1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chip{white-space:nowrap;padding:8px 15px;border-radius:20px;background:#fff;border:1px solid var(--bd);font-size:.85rem;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--bd);cursor:pointer}.row:last-child{border:0}
.row .i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.row .t{flex:1;min-width:0}.row b{font-weight:600}.tag{font-size:.7rem;padding:2px 8px;border-radius:9px;background:var(--gold);color:#2b2200;font-weight:700}
.f{display:flex;gap:8px}.f>*{flex:1}.err{color:var(--er);font-size:.88rem;margin-top:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav a{display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--mut);cursor:pointer;min-width:56px}.nav i{font-style:normal;font-size:1.25rem;color:var(--tx)}
.fab{width:56px;height:56px;border-radius:50%;padding:0;font-size:1.9rem;margin-top:-30px;border:4px solid var(--bg);box-shadow:0 4px 12px rgba(15,77,58,.35)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px 22px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}.sheet .x{position:absolute;right:20px;width:34px;height:34px;padding:0;background:var(--bd);color:var(--tx);border-radius:50%}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--gold)}.st.on{background:#6ee7b0}
</style></head><body><main id="app"></main><div id="m"><div class="sheet" id="mb"></div></div>
<script>
// >>> Paste your Google Apps Script Web app URL between the quotes <<<
var APPS_SCRIPT_URL="";
var KEY="mv_entry_state",app=document.getElementById("app"),M=document.getElementById("m"),MB=document.getElementById("mb");
var S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.learners=S.learners||[];S.outbox=S.outbox||[];var busy=false,qs="",fsd="";
var demo=false;
function save(){if(demo)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Phone storage is full. Please sync and free some space.")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function post(body){return fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json()})}
function view(){var v=S.learners.map(function(l){return{key:"r"+l.row,row:l.row,v:Object.assign({},l.v),pending:false}});
  S.outbox.forEach(function(o){if(o.row){var x=v.find(function(a){return a.row===o.row});if(x){Object.assign(x.v,o.data);x.pending=true}}else v.push({key:"n"+o.id,row:null,oid:o.id,v:Object.assign({"NO":"new"},o.data),pending:true})});return v}
function login(){
  app.innerHTML='<div class="hero" style="margin-top:7vh;padding:24px 20px"><img src="icon-192.png" alt="" style="width:64px;height:64px;padding:0;border:0;border-radius:16px;display:block"><h1 style="font-size:1.6rem;margin:16px 0 4px">Every learner, one place</h1><div style="opacity:.75;font-size:.85rem">Mvama Primary School · works offline</div><label style="color:#bcd8cc">Your PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div style="height:12px"></div><button id="go">Log in</button><div class="err" id="e" style="color:#ffb4b4"></div><div style="height:10px"></div><button class="wh" id="rg">First time? Register</button>'+(APPS_SCRIPT_URL?"":'<div style="height:10px"></div><button class="g" id="dm">Preview the look (sample data)</button>')+'<div style="opacity:.65;font-size:.75rem;margin-top:12px;text-align:center">Forgot your PIN? Ask the administrator to remove your row in the Teachers tab, then register again.</div></div>';
  document.getElementById("rg").onclick=function(e){e.preventDefault();reg()};document.getElementById("go").onclick=doLogin;var dm=document.getElementById("dm");if(dm)dm.onclick=demoMode;document.getElementById("pin").onkeydown=function(e){if(e.key==="Enter")doLogin()}}
function demoMode(){demo=true;var n=[["Banda","Chikondi","M",9],["Phiri","Mercy","F",8],["Kamanga","Thoko","F",9],["Mwale","Tadala","M",10],["Chirwa","Esther","F",9],["Nyirenda","Yamikani","M",8],["Gondwe","Grace","F",9],["Tembo","Chisomo","M",9],["Mkandawire","Blessings","F",10],["Zulu","Kondwani","M",9]];
  S={pin:"demo",teacher:"Demo Teacher",stds:["3"],outbox:[{id:"d1",row:104,data:{AGE:"9"}}],learners:n.map(function(p,i){return{row:100+i,v:{NO:String(i+1),SURNAME:p[0],"FIRST NAME":p[1],"PUPIL CODE (LIN)":"260030"+String(100000000+i*7919).padStart(10,"0"),SEX:p[2],AGE:String(p[3]),STD:"3",NATIONALITY:"Malawian"}}})};main()}
function reg(){
  app.innerHTML='<div class="card" style="margin-top:6vh"><h1>Register</h1><div class="sub">One time only. Needs internet.</div><label>Your full name</label><input id="rn" autocomplete="off"><label>Std you teach</label><div style="display:flex;flex-wrap:wrap;gap:12px;font-size:.95rem">'+[1,2,3,4,5,6,7,8].map(function(n){return'<label style="display:flex;gap:5px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" class="rs" value="'+n+'" style="width:auto">'+n+'</label>'}).join("")+'</div><label>Choose a PIN (at least 6 characters)</label><input id="rp" type="password" autocomplete="off"><label>Repeat PIN</label><input id="rp2" type="password" autocomplete="off"><label>School code (from the administrator)</label><input id="rc" autocomplete="off"><div class="err" id="e"></div><div class="f" style="margin-top:14px"><button class="g" id="rb">Back</button><button id="rs">Register</button></div></div>';
  document.getElementById("rb").onclick=login;
  document.getElementById("rs").onclick=async function(){var e=document.getElementById("e"),v=function(i){return document.getElementById(i).value.trim()},
    stds=Array.prototype.filter.call(document.querySelectorAll(".rs"),function(c){return c.checked}).map(function(c){return c.value});
    if(!APPS_SCRIPT_URL){e.textContent="App not set up yet: APPS_SCRIPT_URL is empty.";return}
    if(!v("rn")||!stds.length){e.textContent="Enter your name and choose your Std.";return}
    if(v("rp").length<6){e.textContent="PIN must be at least 6 characters.";return}
    if(v("rp")!==v("rp2")){e.textContent="The two PINs do not match.";return}
    var pin=v("rp");if(S.pin&&S.pin!==pin&&S.outbox.length){e.textContent="Another teacher has unsynced entries on this phone. Sync them first.";return}
    e.textContent="Registering…";
    try{var r=await post({action:"register",name:v("rn"),stds:stds,pin:pin,code:v("rc")});
      if(!r.ok){e.textContent=r.error;return}
      var l=await post({pin:pin,records:[]});if(!l.ok){e.textContent="Registered, but login failed: "+l.error;return}
      if(S.pin!==pin)S.outbox=[];S.pin=pin;S.teacher=l.teacher;S.stds=l.stds;S.learners=l.learners;save();main()
    }catch(x){e.textContent="No internet. Registration needs internet."}}}
async function doLogin(){var pin=document.getElementById("pin").value.trim(),e=document.getElementById("e");if(!pin)return;
  if(!APPS_SCRIPT_URL){e.textContent="App not set up yet: APPS_SCRIPT_URL is empty.";return}
  e.textContent="Checking…";
  try{var r=await post({pin:pin,records:[]});
    if(!r.ok){e.textContent=r.error==="Wrong PIN"?"Wrong PIN.":"Error: "+r.error;return}
    if(S.pin&&S.pin!==pin&&S.outbox.length){e.textContent="Another teacher has unsynced entries on this phone. Sync them first.";return}
    if(S.pin!==pin)S.outbox=[];
    S.pin=pin;S.teacher=r.teacher;S.stds=r.stds;S.learners=r.learners;save();main()
  }catch(x){if(S.pin&&S.pin===pin){main()}else e.textContent="No internet. The first login needs internet; after that it works offline."}}
var fx="";
function main(){var hr=new Date().getHours(),gr=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  app.innerHTML='<div class="bar"><div><div class="sub">'+gr+'</div><h1>'+esc(S.teacher)+' <span class="pill">Std '+esc(S.stds.join(", "))+'</span></h1></div><div class="av">'+esc((S.teacher||"?")[0].toUpperCase())+'</div></div>'
  +'<div class="hero"><small>Total learners</small><div class="big" id="tot">0</div><span class="pill" id="pl"></span><div class="mini"><div><small>Boys</small><b id="bo">0</b></div><div><small>Girls</small><b id="gi">0</b></div><div><small>Waiting</small><b id="wa">0</b></div></div></div>'
  +'<input id="q" placeholder="Search name or LIN…" value="'+esc(qs)+'" style="margin:14px 0 10px"><div class="chips" id="ch"></div><div class="card" id="ls" style="padding:4px 12px"></div>'
  +'<div class="nav"><a id="n1"><i>⌂</i>Home</a><a id="n2"><i>⟳</i>Sync</a><button class="fab" id="ad">+</button><a id="n3"><i>⌕</i>Search</a><a id="n4"><i>⏻</i>Log out</a></div>';
  document.getElementById("q").oninput=function(e){qs=e.target.value;list()};
  document.getElementById("ad").onclick=function(){form(null)};document.getElementById("n2").onclick=sync;
  document.getElementById("n1").onclick=function(){scrollTo(0,0)};document.getElementById("n3").onclick=function(){scrollTo(0,0);document.getElementById("q").focus()};
  document.getElementById("n4").onclick=function(){if(S.outbox.length){alert("You have "+S.outbox.length+" entries not yet uploaded. Sync first (needs internet).");return}
    if(confirm("Log out?")){demo=false;S={learners:[],outbox:[]};save();login()}};
  list();status()}
function status(){var t=document.getElementById("tot");if(!t)return;var v=view(),on=navigator.onLine,w=S.outbox.length;
  t.textContent=v.length;document.getElementById("bo").textContent=v.filter(function(x){return x.v.SEX==="M"}).length;document.getElementById("gi").textContent=v.filter(function(x){return x.v.SEX==="F"}).length;document.getElementById("wa").textContent=w;
  document.getElementById("pl").innerHTML='<span class="st'+(on?" on":"")+'"></span>'+(on?"Online":"Offline")+" · "+(w?w+" waiting to upload":"All synced")}
function chips(){var o=[["","All"],["M","Boys"],["F","Girls"]],h="";o.forEach(function(c){h+='<span class="chip'+(fx===c[0]&&!fsd?" on":"")+'" data-s="" data-x="'+c[0]+'">'+c[1]+'</span>'});
  if(S.stds.length>1)S.stds.forEach(function(s){h+='<span class="chip'+(fsd===s?" on":"")+'" data-s="'+esc(s)+'" data-x="">Std '+esc(s)+'</span>'});
  var el=document.getElementById("ch");el.innerHTML=h;Array.prototype.forEach.call(el.children,function(c){c.onclick=function(){fx=c.dataset.x;fsd=c.dataset.s;chips();list()}})}
function list(){chips();var v=view().filter(function(x){var t=(x.v["SURNAME"]+" "+x.v["FIRST NAME"]+" "+x.v["PUPIL CODE (LIN)"]).toLowerCase();return(!qs||t.indexOf(qs.toLowerCase())>-1)&&(!fsd||String(x.v["STD"])===fsd)&&(!fx||x.v.SEX===fx)});
  document.getElementById("ls").innerHTML=v.length?v.slice(0,200).map(function(x){var nm=(x.v["SURNAME"]+" "+x.v["FIRST NAME"]).trim();return'<div class="row" data-k="'+x.key+'"><div class="i" style="background:'+(x.v.SEX==="F"?"#c2527f":"#0f4d3a")+'">'+esc((x.v["FIRST NAME"]||"?")[0].toUpperCase())+'</div><div class="t"><b>'+(esc(nm)||"(no name)")+'</b><div class="sub">'+esc(x.v["SEX"])+' · age '+esc(x.v["AGE"]||"—")+' · Std '+esc(x.v["STD"])+'</div></div>'+(x.pending?'<span class="tag">waiting</span>':"")+'</div>'}).join("")+(v.length>200?'<div class="sub" style="padding:8px">Showing 200 of '+v.length+'. Use search.</div>':""):'<div class="sub" style="padding:12px">No learners found.</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".row"),function(r){r.onclick=function(){form(view().find(function(x){return x.key===r.dataset.k}))}})}
function pick(box,hid){var el=document.getElementById(box);Array.prototype.forEach.call(el.children,function(c){c.classList.toggle("on",c.dataset.v===document.getElementById(hid).value);c.onclick=function(){if(el.dataset.lock)return;document.getElementById(hid).value=c.dataset.v;pick(box,hid)}})}
function form(x){var d=x?x.v:{STD:S.stds[0]},isNew=!x,sd=String(d.STD||S.stds[0]);
  var fld=function(k,l,t){return'<label>'+l+'</label><input id="f_'+k.replace(/\W/g,"")+'" type="'+(t||"text")+'"'+(t==="number"?' inputmode="numeric"':"")+' value="'+esc(d[k]||"")+'">'};
  MB.innerHTML='<div class="grab"></div><button class="x" id="c">×</button><h1>'+(isNew?"Add learner":"Edit learner")+'</h1>'+fld("SURNAME","Surname")+fld("FIRST NAME","First name")+fld("PUPIL CODE (LIN)","Pupil code (LIN)")
  +'<label>Sex</label><div class="chips" id="cs"><span class="chip" data-v="M">Boy</span><span class="chip" data-v="F">Girl</span></div><input type="hidden" id="f_SEX" value="'+esc(d.SEX||"")+'">'
  +fld("AGE","Age","number")+fld("NATIONALITY","Nationality")
  +'<label>Std</label><div class="chips" id="cd"'+(isNew&&S.stds.length>1?"":' data-lock="1"')+'>'+(isNew?S.stds:[sd]).map(function(s){return'<span class="chip" data-v="'+esc(s)+'">Std '+esc(s)+'</span>'}).join("")+'</div><input type="hidden" id="f_STD" value="'+esc(sd)+'">'
  +'<div class="err" id="fe"></div><div style="height:14px"></div><button class="dk" id="s">'+(isNew?"Confirm &amp; add":"Save changes")+'</button>';
  pick("cs","f_SEX");pick("cd","f_STD");M.classList.add("on");document.getElementById("c").onclick=function(){M.classList.remove("on")};
  M.onclick=function(e){if(e.target===M)M.classList.remove("on")};
  document.getElementById("s").onclick=function(){
    var g=function(k){return document.getElementById("f_"+k.replace(/\W/g,"")).value.trim()};
    var data={SURNAME:g("SURNAME"),"FIRST NAME":g("FIRST NAME"),"PUPIL CODE (LIN)":g("PUPIL CODE (LIN)"),SEX:g("SEX"),AGE:g("AGE"),NATIONALITY:g("NATIONALITY")},fe=document.getElementById("fe");
    if(!data.SURNAME||!data["FIRST NAME"]){fe.textContent="Surname and first name are required.";return}
    if(!data.SEX){fe.textContent="Please choose Boy or Girl.";return}
    if(data["PUPIL CODE (LIN)"]&&!/^\d{16}$/.test(data["PUPIL CODE (LIN)"])&&!confirm("The LIN is not 16 digits. Save anyway?"))return;
    if(isNew){data.STD=g("STD");S.outbox.push({id:uid(),data:data})}
    else if(x.row){var o=S.outbox.find(function(a){return a.row===x.row});if(o)Object.assign(o.data,data);else S.outbox.push({id:uid(),row:x.row,data:data})}
    else{var p=S.outbox.find(function(a){return a.id===x.oid});Object.assign(p.data,data)}
    save();M.classList.remove("on");list();status();sync()}}
async function sync(){if(demo||busy||!navigator.onLine||!S.pin)return;busy=true;var b=document.getElementById("sy");if(b){b.disabled=true;b.textContent="Syncing…"}
  try{var sent=S.outbox.slice(),r=await post({pin:S.pin,records:sent});
    if(!r.ok){alert(r.error==="Wrong PIN"?"Your PIN is no longer valid. Contact the administrator.":"Sync error: "+r.error)}
    else{var bad=[],ids={};r.results.forEach(function(x){ids[x.id]=1;if(!x.ok)bad.push(x.error)});
      S.outbox=S.outbox.filter(function(o){return!ids[o.id]});S.learners=r.learners;save();
      if(bad.length)alert(bad.length+" entry(ies) were rejected: "+bad[0])}
  }catch(e){}
  busy=false;if(b){b.disabled=false;b.textContent="Sync"}if(document.getElementById("ls")){list();status()}}
window.addEventListener("online",function(){status();sync()});window.addEventListener("offline",status);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
if(S.pin&&S.teacher){main();sync()}else login();
</script></body></html>
